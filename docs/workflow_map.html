<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Physics Research Workflow Map</title>
  <style>
    :root {
      color-scheme: light;
      --bg: #f7f7f4;
      --panel: #ffffff;
      --ink: #202124;
      --muted: #5f6368;
      --line: #d2d7d3;
      --accent: #0f766e;
      --accent-2: #7c2d12;
      --focus: #0b57d0;
    }
    * { box-sizing: border-box; }
    body {
      margin: 0;
      font-family: ui-sans-serif, system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      color: var(--ink);
      background: var(--bg);
    }
    header {
      padding: 20px 24px 12px;
      border-bottom: 1px solid var(--line);
      background: var(--panel);
    }
    h1 { margin: 0 0 6px; font-size: 24px; }
    p { line-height: 1.45; }
    .shell {
      display: grid;
      grid-template-columns: minmax(0, 1fr) 380px;
      gap: 16px;
      padding: 16px;
    }
    .panel {
      background: var(--panel);
      border: 1px solid var(--line);
      border-radius: 8px;
      overflow: hidden;
    }
    .tabs {
      display: flex;
      gap: 8px;
      padding: 12px;
      border-bottom: 1px solid var(--line);
    }
    button {
      border: 1px solid var(--line);
      background: #fff;
      color: var(--ink);
      border-radius: 6px;
      padding: 8px 10px;
      cursor: pointer;
      font: inherit;
    }
    button:hover, button:focus-visible {
      border-color: var(--focus);
      outline: none;
    }
    button.active {
      background: var(--accent);
      color: white;
      border-color: var(--accent);
    }
    .diagram-wrap { padding: 12px; overflow: auto; }
    svg { width: 100%; min-width: 920px; height: 620px; }
    .edge { stroke: #8c958f; stroke-width: 2; fill: none; marker-end: url(#arrow); }
    .node rect { fill: #fff; stroke: #b9c3bd; stroke-width: 2; rx: 8; }
    .node.active rect { stroke: var(--accent); stroke-width: 4; }
    .node text { pointer-events: none; fill: var(--ink); }
    .node .phase { fill: var(--muted); font-size: 12px; text-transform: uppercase; }
    .node .title { font-size: 15px; font-weight: 700; }
    .node:hover rect { stroke: var(--focus); }
    aside { padding: 16px; }
    aside h2 { margin: 0 0 8px; font-size: 20px; }
    .meta { color: var(--muted); font-size: 13px; margin-bottom: 14px; }
    .section { margin-top: 18px; }
    .section h3 { margin: 0 0 8px; font-size: 14px; text-transform: uppercase; letter-spacing: 0.04em; color: var(--muted); }
    ul { margin: 0; padding-left: 20px; }
    li { margin: 5px 0; }
    a { color: var(--accent-2); text-decoration-thickness: 1px; text-underline-offset: 2px; }
    .docs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
    }
    .docs a, .docs button {
      display: inline-block;
      border: 1px solid var(--line);
      border-radius: 6px;
      padding: 6px 8px;
      text-decoration: none;
      color: var(--ink);
      background: #fbfbf8;
      font: inherit;
      cursor: pointer;
    }
    .docs a:hover, .docs button:hover { border-color: var(--focus); }
    .file-preview {
      margin-top: 14px;
      border: 1px solid var(--line);
      border-radius: 8px;
      background: #fbfbf8;
      overflow: hidden;
    }
    .file-preview .preview-head {
      display: flex;
      justify-content: space-between;
      gap: 8px;
      padding: 8px 10px;
      border-bottom: 1px solid var(--line);
      font-size: 13px;
      color: var(--muted);
    }
    .file-preview pre {
      margin: 0;
      padding: 10px;
      max-height: 230px;
      overflow: auto;
      white-space: pre-wrap;
      font-size: 12px;
      line-height: 1.4;
    }
    footer {
      padding: 12px 24px 20px;
      color: var(--muted);
      font-size: 13px;
    }
    @media (max-width: 900px) {
      .shell { grid-template-columns: 1fr; }
      svg { min-width: 760px; }
    }
  </style>
</head>
<body>
  <header>
    <h1>Physics Research Workflow Map</h1>
    <p>Click a workflow node to inspect the responsible skills, docs, scripts, gates, and links. This file is generated from <a href="workflow_map.json">docs/workflow_map.json</a>.</p>
  </header>
  <main class="shell">
    <section class="panel">
      <div class="tabs" id="tabs"></div>
      <div class="diagram-wrap" id="diagram"></div>
    </section>
    <aside class="panel" id="details" aria-live="polite"></aside>
  </main>
  <footer>
    Related docs: <a href="workflow_overview.md">workflow_overview.md</a>,
    <a href="workflow_diagrams.md">workflow_diagrams.md</a>,
    <a href="paper_logic_diagram.md">paper_logic_diagram.md</a>.
  </footer>
  <script>
    const DATA = {"maps": [{"id": "research_workflow", "title": "Physics Research Workflow", "description": "Pre-run and iterative workflow for physics research with baseline gates, validation, researcher review, and lineage.", "nodes": [{"id": "intake", "title": "1. Intake", "phase": "setup", "x": 80, "y": 80, "summary": "Decide whether this is a new project or an existing research retrofit.", "responsible": [{"label": "Existing research onboarding", "path": "skills/existing-research-onboarding/SKILL.md"}, {"label": "Project intake", "path": "docs/existing_project_intake.md"}, {"label": "Adoption log", "path": "docs/adoption_log.md"}, {"label": "Audit existing project script", "path": "scripts/audit_existing_project.py"}], "checks": ["Do not reorganize old artifacts before inventory.", "Mark existing validation status honestly."], "edges": ["plan"]}, {"id": "plan", "title": "2. Plan", "phase": "planning", "x": 340, "y": 80, "summary": "Define research question, model scope, assumptions, expected observables, and failure criteria.", "responsible": [{"label": "Research plan review", "path": "skills/research-plan-review/SKILL.md"}, {"label": "Research plan", "path": "docs/research_plan.md"}, {"label": "Research state", "path": "docs/research_state.md"}], "checks": ["Assumptions and units are explicit.", "Baseline and review checkpoint are identified."], "edges": ["model"]}, {"id": "model", "title": "3. Specify Model", "phase": "model", "x": 600, "y": 80, "summary": "Make physical system, degrees of freedom, equations, parameters, and validity regime explicit.", "responsible": [{"label": "Model specification", "path": "skills/model-specification/SKILL.md"}, {"label": "Assumptions log", "path": "docs/assumptions.md"}, {"label": "General physics rules", "path": "PHYSICS.md"}], "checks": ["Variables and parameters are defined.", "Initial and boundary conditions are not silent."], "edges": ["dimensions"]}, {"id": "dimensions", "title": "4. Check Dimensions", "phase": "model", "x": 860, "y": 80, "summary": "Check units, dimensions, constants set to one, and nondimensionalization.", "responsible": [{"label": "Dimensional analysis", "path": "skills/dimensional-analysis/SKILL.md"}, {"label": "PHYSICS equation discipline", "path": "PHYSICS.md"}], "checks": ["Do not patch missing dimensions by guessing.", "Record ambiguous nondimensionalization."], "edges": ["baseline"]}, {"id": "baseline", "title": "5. Baseline Gate", "phase": "validation", "x": 860, "y": 260, "summary": "Validate a toy model, known limit, reproduction target, conservation case, or dimensional sanity case.", "responsible": [{"label": "Baseline validation", "path": "skills/baseline-validation/SKILL.md"}, {"label": "Baseline registry", "path": "docs/baseline_registry.md"}, {"label": "Toy model log", "path": "docs/toy_model_log.md"}, {"label": "Reproduction log", "path": "docs/reproduction_log.md"}], "checks": ["Do not proceed to full-scale interpretation without pass or explicit waiver.", "Record what this baseline does not justify."], "edges": ["execute"]}, {"id": "execute", "title": "6. Execute Small Iteration", "phase": "execution", "x": 600, "y": 260, "summary": "Run or derive the smallest meaningful result before expanding scope.", "responsible": [{"label": "Numerical validation", "path": "skills/numerical-validation/SKILL.md"}, {"label": "Validation log", "path": "docs/validation_log.md"}, {"label": "Research state", "path": "docs/research_state.md"}], "checks": ["Record commands, parameters, seeds, and outputs.", "Run smallest relevant validation first."], "edges": ["anomaly", "review"]}, {"id": "anomaly", "title": "7. Anomaly Branch", "phase": "debugging", "x": 340, "y": 260, "summary": "If behavior is surprising, classify and reproduce the anomaly before patching.", "responsible": [{"label": "Anomaly debugging", "path": "skills/anomaly-debugging/SKILL.md"}, {"label": "Anomaly log", "path": "docs/anomaly_log.md"}, {"label": "Negative results", "path": "docs/negative_results.md"}], "checks": ["State expected behavior and observed behavior.", "Classify physical, model, numerical, implementation, data, plotting, or unknown."], "edges": ["execute", "review"]}, {"id": "review", "title": "8. Researcher Review", "phase": "review", "x": 80, "y": 260, "summary": "Package results for researcher judgment and record decisions.", "responsible": [{"label": "Researcher review loop", "path": "skills/researcher-review-loop/SKILL.md"}, {"label": "Researcher review log", "path": "docs/researcher_review_log.md"}, {"label": "Decision log", "path": "docs/decision_log.md"}], "checks": ["Separate observations, interpretation, and speculation.", "State what the researcher needs to confirm."], "edges": ["claim"]}, {"id": "claim", "title": "9. Claim Gate", "phase": "claim", "x": 340, "y": 440, "summary": "Before strengthening a claim, map evidence and choose safe wording.", "responsible": [{"label": "Scientific verification before claim", "path": "skills/scientific-verification-before-claim/SKILL.md"}, {"label": "Claim to evidence", "path": "skills/claim-to-evidence/SKILL.md"}, {"label": "Decision log", "path": "docs/decision_log.md"}], "checks": ["Use the weakest wording supported by evidence.", "Do not infer mechanism or universality without support."], "edges": ["retrospective", "paper_question"]}, {"id": "retrospective", "title": "10. Retrospective", "phase": "memory", "x": 600, "y": 440, "summary": "Record what changed, evidence delta, reusable artifact, and next smallest iteration.", "responsible": [{"label": "Research retrospective", "path": "skills/research-retrospective/SKILL.md"}, {"label": "Research retrospective log", "path": "docs/research_retrospective.md"}, {"label": "Lineage template", "path": "docs/lineage/iteration_template.md"}, {"label": "Tacit patterns", "path": "docs/tacit_patterns.md"}], "checks": ["Every iteration should leave a reusable artifact or explain why not.", "Update research state for the next session."], "edges": ["plan"]}, {"id": "paper_question", "title": "Paper Path?", "phase": "paper", "x": 860, "y": 440, "summary": "If the result may become a paper, move into the paper logic map before drafting strong claims.", "responsible": [{"label": "Paper logic diagram", "path": "docs/paper_logic_diagram.md"}, {"label": "Workflow diagrams", "path": "docs/workflow_diagrams.md"}, {"label": "Scientific verification before claim", "path": "skills/scientific-verification-before-claim/SKILL.md"}], "checks": ["Do not draft manuscript logic stronger than the evidence chain.", "Map each result to a claim role."], "edges": []}]}, {"id": "paper_logic", "title": "Paper Logic Structure", "description": "Logical path from research question to manuscript claims, including evidence gates and limitation handling.", "nodes": [{"id": "paper_question", "title": "1. Research Question", "phase": "paper", "x": 80, "y": 90, "summary": "State the precise physical question the paper can answer.", "responsible": [{"label": "Research plan", "path": "docs/research_plan.md"}, {"label": "Open questions", "path": "docs/open_questions.md"}], "checks": ["Question is answerable by the model and data."], "edges": ["paper_gap"]}, {"id": "paper_gap", "title": "2. Literature Gap", "phase": "paper", "x": 320, "y": 90, "summary": "State what is missing in prior work without inventing novelty.", "responsible": [{"label": "Claim to evidence", "path": "skills/claim-to-evidence/SKILL.md"}, {"label": "Scientific verification before claim", "path": "skills/scientific-verification-before-claim/SKILL.md"}], "checks": ["Novelty claims need citation support."], "edges": ["paper_model"]}, {"id": "paper_model", "title": "3. Model and Assumptions", "phase": "paper", "x": 560, "y": 90, "summary": "Introduce the model only as far as needed to support the paper question.", "responsible": [{"label": "Model specification", "path": "skills/model-specification/SKILL.md"}, {"label": "Assumptions log", "path": "docs/assumptions.md"}, {"label": "PHYSICS", "path": "PHYSICS.md"}], "checks": ["Assumptions and validity regime are visible."], "edges": ["paper_methods"]}, {"id": "paper_methods", "title": "4. Methods and Validation", "phase": "paper", "x": 800, "y": 90, "summary": "Show how analytical, numerical, or empirical methods were validated.", "responsible": [{"label": "Baseline validation", "path": "skills/baseline-validation/SKILL.md"}, {"label": "Numerical validation", "path": "skills/numerical-validation/SKILL.md"}, {"label": "Validation log", "path": "docs/validation_log.md"}], "checks": ["Validation is adequate for the intended claim level."], "edges": ["paper_result"]}, {"id": "paper_result", "title": "5. Result", "phase": "paper", "x": 800, "y": 300, "summary": "Present the core result with uncertainty, regime, and provenance.", "responsible": [{"label": "Researcher review loop", "path": "skills/researcher-review-loop/SKILL.md"}, {"label": "Research state", "path": "docs/research_state.md"}, {"label": "Lineage", "path": "docs/lineage/README.md"}], "checks": ["Result links back to scripts, data, equations, or logs."], "edges": ["paper_claim"]}, {"id": "paper_claim", "title": "6. Claim", "phase": "paper", "x": 560, "y": 300, "summary": "Translate result into the strongest safe manuscript claim.", "responsible": [{"label": "Scientific verification before claim", "path": "skills/scientific-verification-before-claim/SKILL.md"}, {"label": "Claim to evidence", "path": "skills/claim-to-evidence/SKILL.md"}, {"label": "Decision log", "path": "docs/decision_log.md"}], "checks": ["Claim language matches evidence level."], "edges": ["paper_limits"]}, {"id": "paper_limits", "title": "7. Limitations", "phase": "paper", "x": 320, "y": 300, "summary": "State what the model, data, and validation do not justify.", "responsible": [{"label": "Negative results", "path": "docs/negative_results.md"}, {"label": "Anomaly log", "path": "docs/anomaly_log.md"}, {"label": "Open questions", "path": "docs/open_questions.md"}], "checks": ["Limitations include failed or partial validation where relevant."], "edges": ["paper_conclusion"]}, {"id": "paper_conclusion", "title": "8. Conclusion", "phase": "paper", "x": 80, "y": 300, "summary": "Return to the research question and state only what is now supported.", "responsible": [{"label": "Research retrospective", "path": "skills/research-retrospective/SKILL.md"}, {"label": "Researcher review log", "path": "docs/researcher_review_log.md"}], "checks": ["Conclusion does not exceed claim gate."], "edges": []}]}]};
    let activeMap = DATA.maps[0].id;
    let activeNode = DATA.maps[0].nodes[0].id;

    function pathHref(path) {
      if (path.startsWith('docs/')) return path.replace(/^docs\//, '');
      return '../' + path;
    }

    function currentMap() {
      return DATA.maps.find(map => map.id === activeMap);
    }

    function currentNode() {
      const map = currentMap();
      return map.nodes.find(node => node.id === activeNode) || map.nodes[0];
    }

    function escapeHtml(value) {
      return String(value).replace(/[&<>"']/g, char => ({
        '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;'
      }[char]));
    }

    function renderTabs() {
      const tabs = document.getElementById('tabs');
      tabs.innerHTML = '';
      DATA.maps.forEach(map => {
        const button = document.createElement('button');
        button.textContent = map.title;
        button.className = map.id === activeMap ? 'active' : '';
        button.addEventListener('click', () => {
          activeMap = map.id;
          activeNode = map.nodes[0].id;
          render();
        });
        tabs.appendChild(button);
      });
    }

    function renderDiagram() {
      const map = currentMap();
      const nodesById = Object.fromEntries(map.nodes.map(node => [node.id, node]));
      const edgeMarkup = map.nodes.flatMap(node =>
        (node.edges || []).map(targetId => {
          const target = nodesById[targetId];
          if (!target) return '';
          const x1 = node.x + 180;
          const y1 = node.y + 45;
          const x2 = target.x;
          const y2 = target.y + 45;
          const mid = (x1 + x2) / 2;
          return `<path class="edge" d="M ${x1} ${y1} C ${mid} ${y1}, ${mid} ${y2}, ${x2} ${y2}" />`;
        })
      ).join('');

      const nodeMarkup = map.nodes.map(node => `
        <g class="node ${node.id === activeNode ? 'active' : ''}" tabindex="0" role="button" aria-label="${escapeHtml(node.title)}" data-node="${escapeHtml(node.id)}" transform="translate(${node.x}, ${node.y})">
          <rect width="190" height="92"></rect>
          <text class="phase" x="14" y="24">${escapeHtml(node.phase)}</text>
          <text class="title" x="14" y="48">${escapeHtml(node.title)}</text>
          <text x="14" y="72" font-size="12">${escapeHtml(node.summary.slice(0, 28))}${node.summary.length > 28 ? '...' : ''}</text>
        </g>
      `).join('');

      document.getElementById('diagram').innerHTML = `
        <svg viewBox="0 0 1120 620" role="img" aria-label="${escapeHtml(map.title)}">
          <defs>
            <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
              <path d="M 0 0 L 10 5 L 0 10 z" fill="#8c958f"></path>
            </marker>
          </defs>
          ${edgeMarkup}
          ${nodeMarkup}
        </svg>
      `;
      document.querySelectorAll('.node').forEach(element => {
        const activate = () => {
          activeNode = element.dataset.node;
          renderDiagram();
          renderDetails();
        };
        element.addEventListener('click', activate);
        element.addEventListener('keydown', event => {
          if (event.key === 'Enter' || event.key === ' ') {
            event.preventDefault();
            activate();
          }
        });
      });
    }

    function renderDetails() {
      const map = currentMap();
      const node = currentNode();
      const links = (node.responsible || []).map(item =>
        `<button type="button" class="file-button" data-path="${escapeHtml(pathHref(item.path))}" data-label="${escapeHtml(item.label)}">${escapeHtml(item.label)}</button>`
      ).join('');
      const checks = (node.checks || []).map(check => `<li>${escapeHtml(check)}</li>`).join('');
      document.getElementById('details').innerHTML = `
        <h2>${escapeHtml(node.title)}</h2>
        <div class="meta">${escapeHtml(map.title)} / ${escapeHtml(node.phase)}</div>
        <p>${escapeHtml(node.summary)}</p>
        <div class="section">
          <h3>Responsible Files</h3>
          <div class="docs">${links}</div>
          <div class="file-preview" id="filePreview">
            <div class="preview-head">
              <span>Select a file to preview it here.</span>
              <a id="rawFileLink" href="#" hidden>Open raw file</a>
            </div>
            <pre id="filePreviewText"></pre>
          </div>
        </div>
        <div class="section">
          <h3>Checks</h3>
          <ul>${checks}</ul>
        </div>
      `;
      document.querySelectorAll('.file-button').forEach(button => {
        button.addEventListener('click', async () => {
          const previewText = document.getElementById('filePreviewText');
          const rawLink = document.getElementById('rawFileLink');
          const path = button.dataset.path;
          previewText.textContent = 'Loading ' + path + '...';
          rawLink.hidden = false;
          rawLink.href = path;
          rawLink.textContent = 'Open raw file';
          try {
            const response = await fetch(path);
            if (!response.ok) throw new Error(response.status + ' ' + response.statusText);
            const text = await response.text();
            previewText.textContent = text.slice(0, 8000);
          } catch (error) {
            previewText.textContent = 'Could not preview ' + path + ': ' + error.message;
          }
        });
      });
    }

    function render() {
      renderTabs();
      renderDiagram();
      renderDetails();
    }

    render();
  </script>
</body>
</html>
