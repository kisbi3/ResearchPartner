name: Harness Checks

on:
  push:
  pull_request:
    branches:
      - main

permissions:
  contents: read

jobs:
  deterministic-harness-checks:
    name: deterministic harness checks (${{ matrix.os }})
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - name: Check out repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.13"

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip
          python -m pip install -r requirements.txt

      # CI enforces repository-state deterministic checkers. It complements
      # local hook installation/upgrade paths; it cannot prove that Claude Code
      # PreToolUse/PostToolUse hooks fire in a live runtime.
      - name: Run deterministic harness gates
        run: |
          python -m pytest tests -q
          python scripts/check_harness_manifest.py
          python scripts/check_spawn_contracts.py
          python scripts/check_contract_sync.py
          python scripts/check_domain_manifest.py
          python scripts/evaluate_harness.py --fail-on-partial
